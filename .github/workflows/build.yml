name: Build Horizon

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Horizon.exe (single file, no .NET install needed)
        run: >
          dotnet publish src/Horizon/Horizon.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o out

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item out/Horizon.exe dist/
          Copy-Item -Recurse wallpaper dist/wallpaper
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath Horizon-win-x64.zip

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-win-x64
          path: dist

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Horizon-win-x64.zip
