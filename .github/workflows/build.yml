name: Build KAMI UX

# Runs on every push to main, on pull requests, and when you click "Run workflow".
# Pushing a tag like v0.1.0 also publishes a GitHub Release with the zip attached.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build KamiUX.exe (single file, no .NET install needed)
        run: >
          dotnet publish src/Horizon/Horizon.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o out

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item out/KamiUX.exe dist/
          Copy-Item -Recurse wallpaper dist/wallpaper
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath KamiUX-win-x64.zip

      - name: Upload build (Actions → this run → Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: KamiUX-win-x64
          path: dist

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: KamiUX-win-x64.zip
